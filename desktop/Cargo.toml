[package]
name = "flacbox-desktop"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
gpui = { version = "0.2", features = ["x11"] }
flacplayer = { path = "../core" }
crossbeam-channel = "0.5"
walkdir = "2"
libc = "0.2.191"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
gpui-video-player = "=0.1.3"
url = "2"
gstreamer = "0.25"
gstreamer-app = "0.25"

[profile.dev]
debug = 0
incremental = false

[patch.crates-io]
xattr = { path = "../vendor/xattr" }
