[package]
name = "flacbox-desktop"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
gpui = { version = "0.2", features = ["x11"] }
flacplayer = { path = "../core" }
crossbeam-channel = "0.5"
walkdir = "2"
libc = "=0.2.189"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3"

[profile.dev]
debug = 0
incremental = false
