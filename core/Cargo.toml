[package]
name = "flacplayer"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "flacplayer"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "decodecheck"
path = "src/bin/decodecheck.rs"
required-features = ["cli"]

[features]
cli = []

[dependencies]
symphonia = { version = "0.6", default-features = false, features = [
    "flac",
    "pcm",
    "wav",
    "ogg",
    "vorbis",
    "mp3",
    "aac",
    "isomp4",
    "alac",
    "id3v1",
    "id3v2",
] }
lofty = "0.25"
rtrb = "0.4"
crossbeam-channel = "0.5"
log = "0.4"

[target.'cfg(target_os = "android")'.dependencies]
oboe = "0.6"
jni = "0.21"

[target.'cfg(not(target_os = "android"))'.dependencies]
cpal = "0.18"

[profile.dev]
opt-level = 1
debug = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"
panic = "abort"
